services:
  - type: worker
    name: pixel-x-ultra-single
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node console.js
    autoDeploy: true
    envVars:
      - key: SESSION_ID
        sync: false
      - key: PHONE_NUMBER
        sync: false
      - key: OWNER_NUMBER
        sync: false
      - key: PREFIX
        value: "."
